[package]
name = "orchestrator"
version = "0.1.0"
edition.workspace = true

[dependencies]
axum = "0.8.9"
bollard = "0.21.0"
futures-util = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "time"] }

[dev-dependencies]
http-body-util = "0.1.5"
serde_json = "1.0.151"
tower = { version = "0.5.3", features = ["util"] }

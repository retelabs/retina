[package]
name = "plugin-wasm-example"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

# cdylib so `cargo build --target wasm32-unknown-unknown` produces a
# standalone .wasm binary with the exported functions below, not just an
# rlib for linking into other Rust crates.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
plugin-wasm-wire = { version = "0.1.0", path = "../plugin-wasm-wire" }
serde_json = "1.0.151"

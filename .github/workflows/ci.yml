# Replaces .gitlab-ci.yml since the move to github.com/retelabs/retina
# (2026-09-30). The same steps: fmt/clippy/audit, unit tests, every
# integration test through scripts/test-integration.sh (ClickHouse as a
# service, the orchestrator included: the runner has a Docker daemon), Docker
# images. Private repository, so Actions minutes count: runs on main, on pull
# requests and by hand, not on every push to dev.
name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Fails on any known vulnerability; `paste` (unmaintained, pulled in by
      # clickhouse) stays a warning.
      - run: cargo install cargo-audit --locked && cargo audit

  test:
    runs-on: ubuntu-24.04
    services:
      clickhouse:
        # The same version as docker/docker-compose.*.yml (git grep clickhouse-server:).
        image: clickhouse/clickhouse-server:26.8.15.10
        env:
          CLICKHOUSE_DB: observability
          CLICKHOUSE_USER: dev
          CLICKHOUSE_PASSWORD: dev
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        ports: ["8123:8123"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: IT_CLICKHOUSE_URL=http://127.0.0.1:8123 scripts/test-integration.sh --with-docker

  images:
    needs: [check, test]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [kernel, query-api]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Built on every run (the Dockerfile stays checked); pushed to GHCR only
      # on a v* tag or by hand, so as not to pile up one image per commit in
      # the private package storage.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.component }}.Dockerfile
          push: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
          tags: |
            ghcr.io/retelabs/retina-${{ matrix.component }}:${{ github.sha }}
            ghcr.io/retelabs/retina-${{ matrix.component }}:${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'manual' }}

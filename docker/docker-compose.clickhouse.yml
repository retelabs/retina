services:
  clickhouse:
    # Version exacte épinglée, partout (compose dev/stack/prod, CI,
    # orchestrator) : le client `clickhouse` 0.15.1 casse contre 26.9
    # (`Decompression("incorrect magic number")` dès les migrations,
    # constaté le 2026-09-30), donc un tag flottant peut couper l'ingestion
    # au prochain pull. 26.8 est une LTS. Changer de version = changer
    # toutes les occurrences ensemble (`git grep clickhouse-server:`) et
    # repasser `scripts/test-integration.sh` avant.
    image: clickhouse/clickhouse-server:26.8.15.10
    container_name: venice-clickhouse-dev
    ports:
      - "8123:8123" # HTTP
      - "9000:9000" # native TCP
    environment:
      CLICKHOUSE_DB: observability
      CLICKHOUSE_USER: dev
      CLICKHOUSE_PASSWORD: dev
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse-dev-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

volumes:
  clickhouse-dev-data:

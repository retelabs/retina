# Squelette de déploiement (dossier étape 6) : assemble ClickHouse +
# `kernel` (otlp-receiver + clickhouse-sink) + `query-api` avec les mêmes
# images qui tourneraient sur la VM cible, quel que soit le cloud choisi
# (dossier section 5, toujours ouvert). Build depuis la racine du repo :
#   docker compose -f docker/docker-compose.stack.yml up --build

services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.8.15.10
    environment:
      CLICKHOUSE_DB: observability
      CLICKHOUSE_USER: dev
      CLICKHOUSE_PASSWORD: dev
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse-stack-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  kernel:
    build:
      context: ..
      dockerfile: docker/kernel.Dockerfile
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: dev
      CLICKHOUSE_PASSWORD: dev
      CLICKHOUSE_DATABASE: observability
      # Dev-only fixed token (docs/interfaces/kernel-auth.md), same posture
      # as CLICKHOUSE_PASSWORD above — not meant to survive past local/demo use.
      KERNEL_API_KEY: dev-kernel-key
    ports:
      - "4317:4317"

  query-api:
    build:
      context: ..
      dockerfile: docker/query-api.Dockerfile
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: dev
      CLICKHOUSE_PASSWORD: dev
      CLICKHOUSE_DATABASE: observability
      QUERY_API_KEY: dev-query-key
    ports:
      - "8080:8080"

volumes:
  clickhouse-stack-data:

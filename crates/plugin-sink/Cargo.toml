[package]
name = "plugin-sink"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
kernel-model = { version = "0.1.0", path = "../kernel-model" }
otlp-receiver = { version = "0.1.0", path = "../otlp-receiver" }
plugin-api = { version = "0.1.0", path = "../plugin-api" }
# "rt" for spawn_blocking, "time" for timeout — both needed to isolate a
# plugin's execution from the ingestion critical path (see lib.rs).
tokio = { version = "1.53.1", features = ["macros", "rt", "time"] }

[dev-dependencies]
clickhouse = "0.15.1"
clickhouse-sink = { path = "../clickhouse-sink" }
plugin-fraudos = { path = "../plugin-fraudos" }
plugin-medical = { path = "../plugin-medical" }

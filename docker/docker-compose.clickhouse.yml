services:
  clickhouse:
    # An exact version, pinned everywhere (compose dev/stack/prod, CI,
    # orchestrator): the `clickhouse` 0.15 client breaks against 26.9
    # (`Decompression("incorrect magic number")` as soon as migrations run,
    # seen on 2026-09-30), so a floating tag could stop ingestion at the next
    # pull. 26.8 is an LTS. Changing the version means changing every
    # occurrence together (`git grep clickhouse-server:`) and running
    # `scripts/test-integration.sh` first.
    image: clickhouse/clickhouse-server:26.8.15.10
    container_name: retina-clickhouse-dev
    ports:
      - "8123:8123" # HTTP
      - "9000:9000" # native TCP
    environment:
      CLICKHOUSE_DB: observability
      CLICKHOUSE_USER: dev
      CLICKHOUSE_PASSWORD: dev
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse-dev-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

volumes:
  clickhouse-dev-data:

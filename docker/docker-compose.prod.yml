# VPS deployment skeleton (dossier step 6, TLS part): the production variant
# of docker-compose.stack.yml, the same three services plus Caddy as the TLS
# front. kernel/query-api publish no port on the host: Caddy is the only
# public entry point (ports 80/443). Real secrets come from an uncommitted
# .env file (see docker/.env.prod.example), like CLICKHOUSE_PASSWORD elsewhere
# in this repository.
#
# Network segmentation, three zones rather than one implicit bridge network:
#
#   retina-edge │ Caddy only: the only zone reachable from outside
#   retina-app  │ Caddy ↔ kernel/query-api: application logic
#   retina-data │ kernel/query-api ↔ ClickHouse: critical zone, no access
#               │ from retina-edge (Caddy is not attached to it at all)
#
#   Internet → Caddy (edge) → kernel/query-api (app) → ClickHouse (data)
#                    ✗ ────────────────────────────────────────────────
#
# Start: cp docker/.env.prod.example docker/.env.prod, edit the values
# (scripts/gen-secrets.sh for the tokens), point the DNS of
# ${API_HOST}/${OTLP_HOST} at the VPS's IP, then:
#   docker compose -f docker/docker-compose.prod.yml --env-file docker/.env.prod up -d --build

networks:
  retina-edge:
    driver: bridge
  retina-app:
    driver: bridge
    internal: true    # no direct internet access from kernel/query-api
  retina-data:
    driver: bridge
    internal: true    # critical zone: ClickHouse unreachable from retina-edge

services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.8.15.10
    environment:
      CLICKHOUSE_DB: observability
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse-prod-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 2s
      timeout: 2s
      retries: 30
    networks:
      - retina-data    # edge and app have no access to this network
    restart: unless-stopped

  kernel:
    build:
      context: ..
      dockerfile: docker/kernel.Dockerfile
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DATABASE: observability
      KERNEL_API_KEY: ${KERNEL_API_KEY}
      KERNEL_API_KEYS_EXTRA: ${KERNEL_API_KEYS_EXTRA:-}
      ENABLED_PLUGINS: ${ENABLED_PLUGINS:-}
    # No port published on the host: only Caddy (below) is reachable from
    # outside.
    networks:
      - retina-app     # receives Caddy's traffic
      - retina-data    # reaches ClickHouse
    restart: unless-stopped

  query-api:
    build:
      context: ..
      dockerfile: docker/query-api.Dockerfile
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DATABASE: observability
      QUERY_API_KEY: ${QUERY_API_KEY}
      QUERY_API_KEYS_EXTRA: ${QUERY_API_KEYS_EXTRA:-}
    networks:
      - retina-app     # receives Caddy's traffic
      - retina-data    # reaches ClickHouse
    restart: unless-stopped

  caddy:
    image: caddy:2.11.4
    depends_on:
      - kernel
      - query-api
    environment:
      ACME_EMAIL: ${ACME_EMAIL}
      OTLP_HOST: ${OTLP_HOST}
      API_HOST: ${API_HOST}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - retina-edge    # the only zone with an internet route
      - retina-app     # to reach kernel/query-api by name
    restart: unless-stopped

volumes:
  clickhouse-prod-data:
  caddy-data:
  caddy-config:

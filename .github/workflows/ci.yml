# Remplace .gitlab-ci.yml depuis la migration vers github.com/retelabs/retina
# (2026-09-30). Mêmes étapes : fmt/clippy/audit, tests unitaires, tous les
# tests d'intégration via scripts/test-integration.sh (ClickHouse en service,
# orchestrator compris : le runner a un démon Docker), images Docker.
# Dépôt privé : minutes Actions comptées — déclenché sur main, sur les PR et
# à la main, pas à chaque push sur dev (même logique de quota qu'avant).
name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Échoue sur toute vulnérabilité connue ; `paste` (non maintenu, tiré
      # par clickhouse) reste un avertissement.
      - run: cargo install cargo-audit --locked && cargo audit

  test:
    runs-on: ubuntu-24.04
    services:
      clickhouse:
        # Même version que docker/docker-compose.*.yml (git grep clickhouse-server:).
        image: clickhouse/clickhouse-server:26.8.15.10
        env:
          CLICKHOUSE_DB: observability
          CLICKHOUSE_USER: dev
          CLICKHOUSE_PASSWORD: dev
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        ports: ["8123:8123"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: IT_CLICKHOUSE_URL=http://127.0.0.1:8123 scripts/test-integration.sh --with-docker

  images:
    needs: [check, test]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [kernel, query-api]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Construit à chaque passage (le Dockerfile reste vérifié) ; ne pousse
      # vers GHCR que sur un tag v* ou à la main, pour ne pas accumuler une
      # image par commit dans le stockage des paquets privés.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.component }}.Dockerfile
          push: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
          tags: |
            ghcr.io/retelabs/retina-${{ matrix.component }}:${{ github.sha }}
            ghcr.io/retelabs/retina-${{ matrix.component }}:${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'manual' }}
